networks:
  dev:
    driver: bridge

services:
  client:
    container_name: centria-hub-front
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - dev
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env

  db:
    container_name: centria-hub-db
    image: "postgres:latest"
    networks:
      - dev
    restart: always
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  directus:
    image: directus/directus:11.5.1
    container_name: centria-hub-cms
    ports:
      - "8055:8055"
    volumes:
      - ./database:/directus/database
      - ./uploads:/directus/uploads
      - ./extensions:/directus/extensions
      - ./templates:/directus/templates
    environment:
      SECRET: ${SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DB_CLIENT: "pg"
      DB_HOST: "db"
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      WEBSOCKETS_ENABLED: "true"
    networks:
      - dev
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: